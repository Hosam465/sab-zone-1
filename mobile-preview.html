<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Never serve a stale copy — see the matching note in index.html. -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>SAB Mobile Preview & Testing</title>
<style>
  :root {
    --sab-red: #C93E32;
    --sab-red-light: #E8583F;
    --sab-ink: #0A0605;
    --sab-ink2: #170A08;
    --success: #28a745;
    --bg-color: #12080a;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: radial-gradient(circle at 30% 0%, #2a1210 0%, var(--bg-color) 55%);
    min-height: 100vh;
    margin: 0;
    color: #eee;
  }

  /* Sticky top bar — replaces the old floating status label */
  .top-bar {
    position: sticky;
    top: 0;
    z-index: 20;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 14px 16px;
    background: rgba(10, 6, 5, 0.85);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .conn-status {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.8rem;
    font-weight: 600;
    color: #bbb;
    letter-spacing: 0.03em;
  }
  .status-dot { width: 9px; height: 9px; border-radius: 50%; background: #888; transition: background 0.3s, box-shadow 0.3s; }
  .status-dot.online { background: var(--success); box-shadow: 0 0 8px var(--success); }
  .status-dot.offline { background: #dc3545; box-shadow: 0 0 8px #dc3545; }

  /* Fluid page column — no fixed phone-frame box, so this renders correctly on
     phones, tablets, and desktops alike. Scales up gently on wider screens instead
     of floating a tiny fixed-size mockup in the middle of a tablet display. */
  .page {
    width: 100%;
    max-width: 480px;
    margin: 0 auto;
    padding: 24px 18px 60px;
  }
  @media (min-width: 700px) {
    .page { max-width: 600px; padding: 32px 24px 80px; }
  }
  @media (min-width: 1100px) {
    .page { max-width: 680px; padding: 40px 24px 100px; }
  }

  #render-screen {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .designer-credit {
    text-align: center;
    font-size: 0.78rem;
    color: #a89a97;
    margin-bottom: -4px;
  }
  .designer-credit strong { color: #ddd; }

  /* Loud warning when a journey arrives with no designer attached — without this the
     rating still "succeeds" but the points are credited to nobody and silently lost. */
  .designer-missing {
    background: rgba(220, 53, 69, 0.14);
    border: 1px solid rgba(220, 53, 69, 0.5);
    color: #ffb3b8;
    border-radius: 12px;
    padding: 12px 14px;
    font-size: 0.82rem;
    line-height: 1.45;
    text-align: center;
  }
  .designer-missing strong { color: #fff; display: block; margin-bottom: 3px; }

  /* Premium UI Components */
  .ui-header_nav { background: var(--sab-red); color: white; padding: 20px; text-align: center; font-weight: 600; font-size: 1.1rem; border-radius: 14px; box-shadow: 0 6px 16px rgba(201,62,50,0.3); }
  .ui-account_card { background: white; padding: 20px; border-radius: 16px; box-shadow: 0 6px 20px rgba(0,0,0,0.25); border-left: 5px solid var(--sab-red); color: #222; }
  .ui-account_card .title { font-size: 0.9rem; color: #666; margin-bottom: 5px; }
  .ui-account_card .amount { font-size: 1.6rem; font-weight: bold; color: #222; }

  .ui-form_field { background: white; padding: 14px 18px; border-radius: 14px; box-shadow: 0 4px 14px rgba(0,0,0,0.2); }
  .ui-form_field .label { font-size: 0.75rem; font-weight: 700; color: #999; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 4px; }
  .ui-form_field .value { color: #b3b3b3; font-size: 1rem; }

  .ui-widget_insights { background: white; padding: 18px; border-radius: 16px; box-shadow: 0 6px 20px rgba(0,0,0,0.25); color: #222; }
  .ui-widget_insights .title { font-size: 0.85rem; font-weight: 700; color: #666; margin-bottom: 10px; }
  .ui-widget_insights .bars { display: flex; align-items: flex-end; gap: 6px; height: 44px; }
  .ui-widget_insights .bars span { flex: 1; background: linear-gradient(180deg, var(--sab-red-light), var(--sab-red)); border-radius: 3px; }

  /* Real photography behind the promo banner, dimmed so white text stays readable */
  .ui-banner_offer {
    position: relative;
    padding: 28px 20px;
    border-radius: 16px;
    text-align: center;
    font-weight: 700;
    font-size: 1.05rem;
    color: #fff;
    overflow: hidden;
    box-shadow: 0 8px 24px rgba(201,62,50,0.35);
    background-image:
      linear-gradient(180deg, rgba(10,6,5,0.35), rgba(10,6,5,0.75)),
      url('assets/images/travel-banner.jpg');
    background-size: cover;
    background-position: center 65%;
    min-height: 110px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .ui-carousel_for_you { display: flex; flex-direction: column; gap: 10px; }
  .ui-carousel_for_you .label { font-size: 0.85rem; font-weight: 700; color: #ccc; }
  .ui-carousel_for_you .cards { display: flex; gap: 12px; }
  .ui-carousel_for_you .cards div {
    flex: 1;
    position: relative;
    min-height: 90px;
    border-radius: 14px;
    overflow: hidden;
    display: flex;
    align-items: flex-end;
    padding: 10px 8px;
    font-size: 0.78rem;
    font-weight: 700;
    color: #fff;
    box-shadow: 0 4px 14px rgba(0,0,0,0.3);
    background-size: cover;
    background-position: center;
  }
  .ui-carousel_for_you .cards div::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,0) 40%, rgba(0,0,0,0.75) 100%);
  }
  .ui-carousel_for_you .cards div span { position: relative; z-index: 1; }
  .ui-carousel_for_you .cards .card-travel { background-image: url('assets/images/travel-banner.jpg'); background-position: center 60%; }
  .ui-carousel_for_you .cards .card-points { background-image: url('assets/images/shopping-card.jpg'); }
  .ui-carousel_for_you .cards .card-cashback { background-image: url('assets/images/coffee-card.jpg'); }

  .ui-submit_button { background: var(--success); color: white; padding: 18px; border-radius: 14px; text-align: center; font-weight: bold; font-size: 1.1rem; cursor: pointer; box-shadow: 0 6px 18px rgba(40, 167, 69, 0.35); }

  .ui-bottom_nav { display: flex; justify-content: space-around; background: white; padding: 14px 4px; border-radius: 16px; box-shadow: 0 6px 20px rgba(0,0,0,0.25); }
  .ui-bottom_nav span { font-size: 0.7rem; font-weight: 600; color: #999; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .ui-bottom_nav span:first-child { color: var(--sab-red); }
  .ui-bottom_nav span .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

  /* Usability testing sits in normal page flow BELOW the rendered screen, separated
     by a clear divider — it only comes into view once the visitor scrolls down to
     it, instead of overlaying/covering the screen the moment a journey is published. */
  #usability-test {
    display: none;
    margin-top: 40px;
    padding-top: 28px;
    border-top: 1px solid rgba(255,255,255,0.12);
    animation: fadeIn 0.5s ease-out;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  #usability-test .panel {
    background: #fff;
    color: #222;
    border-radius: 20px;
    padding: 24px 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  }
  #usability-test h4 { margin: 0 0 6px 0; color: var(--sab-ink); text-align: center; font-size: 1.15rem; }
  #usability-test .subtitle { text-align: center; color: #888; font-size: 0.85rem; margin-bottom: 20px; }
  .form-group { margin-bottom: 16px; }
  .form-group label { display: block; font-size: 0.85rem; color: #555; margin-bottom: 6px; font-weight: bold;}
  .btn-group { display: flex; gap: 8px; }
  .toggle-btn { flex: 1; padding: 12px; background: #f0f0f0; border: none; border-radius: 10px; cursor: pointer; color: #555; font-weight: 600; transition: 0.2s; font-size: 0.95rem; }
  .toggle-btn.selected { background: var(--sab-red); color: white; }

  textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 10px; box-sizing: border-box; font-family: inherit; font-size: 0.95rem; resize: none; }
  .submit-feedback-btn { width: 100%; padding: 14px; background: var(--sab-ink); color: white; border: none; border-radius: 10px; font-weight: bold; font-size: 1rem; cursor: pointer; margin-top: 8px; }
  .submit-feedback-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .waiting-msg { text-align: center; color: #998; margin-top: 25vh; font-size: 1.1rem; font-weight: 500; }

  /* Non-blocking toast (a native alert() would freeze an unattended kiosk if nobody taps OK) */
  #toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--sab-ink);
    color: #fff;
    padding: 14px 24px;
    border-radius: 10px;
    font-weight: 600;
    font-size: 0.9rem;
    box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease, transform 0.25s ease;
    z-index: 100;
    max-width: 320px;
    text-align: center;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #toast.error { background: #dc3545; }

  /* Simple Star Rating */
  .rating { display: flex; flex-direction: row-reverse; justify-content: center; gap: 6px; }
  .rating input { display: none; }
  .rating label { font-size: 34px; color: #ccc; cursor: pointer; }
  .rating input:checked ~ label { color: #ffcc00; }

  /* AI scoring overlay — a themed loading moment before the points reveal. Deliberately
     not any real AI vendor's logo/branding: a generic spinning mark in SAB's own colors,
     so nothing here implies a partnership that doesn't exist. */
  #ai-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(8, 4, 3, 0.88);
    backdrop-filter: blur(6px);
    z-index: 300;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 22px;
    text-align: center;
  }
  #ai-overlay.show { display: flex; }

  .ai-orb {
    position: relative;
    width: 84px;
    height: 84px;
  }
  .ai-orb .ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: conic-gradient(from 0deg, var(--sab-red-light), var(--sab-red), transparent 60%);
    animation: ai-spin 1.1s linear infinite;
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 7px), #000 calc(100% - 7px));
            mask: radial-gradient(farthest-side, transparent calc(100% - 7px), #000 calc(100% - 7px));
  }
  .ai-orb .core {
    position: absolute;
    inset: 14px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #2a1210, var(--sab-ink) 70%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 26px;
    box-shadow: inset 0 0 12px rgba(232,88,63,0.4);
    animation: ai-pulse 1.6s ease-in-out infinite;
  }
  @keyframes ai-spin { to { transform: rotate(360deg); } }
  @keyframes ai-pulse { 0%, 100% { opacity: 0.85; transform: scale(1); } 50% { opacity: 1; transform: scale(1.08); } }

  #ai-overlay h4 { margin: 0; color: #fff; font-size: 1.1rem; }
  #ai-overlay p { margin: 0; color: #bbb; font-size: 0.85rem; max-width: 260px; }
  .ai-dots span { display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: var(--sab-red-light); margin: 0 2px; animation: ai-dot 1.2s ease-in-out infinite; }
  .ai-dots span:nth-child(2) { animation-delay: 0.15s; }
  .ai-dots span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes ai-dot { 0%, 80%, 100% { opacity: 0.25; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-3px); } }
</style>
</head>
<body>

<div class="top-bar">
  <div class="conn-status">
    <div class="status-dot" id="status-dot"></div>
    <span id="status-text">Connecting…</span>
  </div>
</div>

<div class="page">
  <div id="render-screen">
    <div class="waiting-msg">Waiting for Build Station...</div>
  </div>

  <!-- Live Usability Testing Form -->
  <div id="usability-test">
    <div class="panel">
      <h4>Usability Feedback</h4>
      <p class="subtitle">Help us understand how this journey felt</p>

      <div class="form-group">
        <label>How clear was this journey?</label>
        <div class="btn-group">
          <button class="toggle-btn option-btn" data-group="clarity" data-val="Clear">Clear</button>
          <button class="toggle-btn option-btn" data-group="clarity" data-val="Unclear">Unclear</button>
        </div>
      </div>

      <div class="form-group">
        <label>Was it easy to use?</label>
        <div class="btn-group">
          <button class="toggle-btn option-btn" data-group="difficulty" data-val="Easy">Easy</button>
          <button class="toggle-btn option-btn" data-group="difficulty" data-val="Difficult">Difficult</button>
        </div>
      </div>

      <div class="form-group">
        <label>Would you use this?</label>
        <div class="btn-group">
          <button class="toggle-btn option-btn" data-group="intent" data-val="Would use">Would Use</button>
          <button class="toggle-btn option-btn" data-group="intent" data-val="Would not use">Wouldn't Use</button>
        </div>
      </div>

      <div class="form-group" style="text-align: center;">
        <label>Overall Rating</label>
        <div class="rating">
          <input type="radio" name="stars" id="star5" value="5"><label for="star5">★</label>
          <input type="radio" name="stars" id="star4" value="4"><label for="star4">★</label>
          <input type="radio" name="stars" id="star3" value="3"><label for="star3">★</label>
          <input type="radio" name="stars" id="star2" value="2"><label for="star2">★</label>
          <input type="radio" name="stars" id="star1" value="1"><label for="star1">★</label>
        </div>
      </div>

      <div class="form-group">
        <textarea id="comment" rows="2" placeholder="Short improvement comment..."></textarea>
      </div>

      <button class="submit-feedback-btn" onclick="submitFeedback()">Submit Feedback</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<!-- AI Scoring Overlay -->
<div id="ai-overlay">
  <div class="ai-orb">
    <div class="ring"></div>
    <div class="core">✨</div>
  </div>
  <h4>Scoring this design…</h4>
  <p>Weighing clarity, ease of use, and intent to use<span class="ai-dots"><span></span><span></span><span></span></span></p>
</div>

<!-- Firebase Logic -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
  import { getDatabase, ref, onValue, set, push, runTransaction } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAe1rTA29BEcV491zEQFizL8axiDasX6a4",
    authDomain: "drop-75326.firebaseapp.com",
    databaseURL: "https://drop-75326-default-rtdb.firebaseio.com",
    projectId: "drop-75326",
    storageBucket: "drop-75326.firebasestorage.app",
    messagingSenderId: "860967558056",
    appId: "1:860967558056:web:3b32b2ce92f14ccc459b9d"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  // Real connection indicator
  const dot = document.getElementById('status-dot');
  const text = document.getElementById('status-text');
  onValue(ref(db, '.info/connected'), (snap) => {
    const connected = snap.val() === true;
    dot.className = 'status-dot ' + (connected ? 'online' : 'offline');
    text.textContent = connected ? 'Live & Connected' : 'Reconnecting…';
  });

  // Real-time listener
  const sessionRef = ref(db, 'sessions/active_demo');

  let currentDesignerName = null;

  onValue(sessionRef, (snapshot) => {
    const data = snapshot.val();
    if (data && data.status === "preview_ready") {
      currentDesignerName = data.designerName || null;
      renderMobileUI(data.canvas);
    } else if (data && data.status === "assembling") {
      currentDesignerName = null;
      resetUI();
    }
  });

  function renderMobileUI(canvasArray) {
    const screen = document.getElementById('render-screen');
    const testingBlock = document.getElementById('usability-test');

    screen.innerHTML = '';

    if (currentDesignerName) {
      const credit = document.createElement('div');
      credit.className = 'designer-credit';
      credit.innerHTML = `Designed by <strong>${escapeHtml(currentDesignerName)}</strong>`;
      screen.appendChild(credit);
    } else {
      const warn = document.createElement('div');
      warn.className = 'designer-missing';
      warn.innerHTML = `<strong>⚠ No designer attached to this journey</strong>Ratings won't award any points. Reload the Build Station page and publish again.`;
      screen.appendChild(warn);
    }

    const componentRenderers = {
      header_nav: () => `SAB Navigation`,
      account_card: () => `<div class="title">Primary Account</div><div class="amount">SAR 12,450.00</div>`,
      form_field: () => `<div class="label">Amount</div><div class="value">Enter amount...</div>`,
      widget_insights: () => `<div class="title">This Month's Spending</div><div class="bars"><span style="height:40%"></span><span style="height:70%"></span><span style="height:55%"></span><span style="height:90%"></span><span style="height:35%"></span></div>`,
      banner_offer: () => `<span style="position:relative;z-index:1;">🌟 Activate Your Travel Card</span>`,
      carousel_for_you: () => `<div class="label">For You</div><div class="cards"><div class="card-travel"><span>Travel Offer</span></div><div class="card-points"><span>2x Points</span></div><div class="card-cashback"><span>Cashback</span></div></div>`,
      submit_button: () => `Confirm Transaction`,
      bottom_nav: () => `<span><span class="dot"></span>Home</span><span><span class="dot"></span>Transfers</span><span><span class="dot"></span>Cards</span><span><span class="dot"></span>More</span>`,
    };

    canvasArray.forEach(item => {
      const uiElement = document.createElement('div');
      uiElement.className = 'ui-' + item.type;
      const render = componentRenderers[item.type];
      uiElement.innerHTML = render ? render() : 'Component';
      screen.appendChild(uiElement);
    });

    testingBlock.style.display = 'block';
    window.scrollTo({ top: 0, behavior: 'instant' });
  }

  function resetUI() {
    document.getElementById('render-screen').innerHTML = '<div class="waiting-msg">Waiting for Build Station...</div>';
    document.getElementById('usability-test').style.display = 'none';
    window.scrollTo({ top: 0, behavior: 'smooth' });

    // Reset buttons and form
    document.querySelectorAll('.option-btn').forEach(btn => btn.classList.remove('selected'));
    document.getElementById('comment').value = '';
    const checkedStar = document.querySelector('input[name="stars"]:checked');
    if(checkedStar) checkedStar.checked = false;

    window.feedbackData = {}; // Clear global object
  }

  // --- UI Logic for the Form ---
  window.feedbackData = {};

  document.querySelectorAll('.option-btn').forEach(button => {
    button.addEventListener('click', function() {
      const group = this.getAttribute('data-group');
      const val = this.getAttribute('data-val');

      // Deselect siblings
      document.querySelectorAll(`.option-btn[data-group="${group}"]`).forEach(btn => btn.classList.remove('selected'));
      // Select this
      this.classList.add('selected');
      // Store value
      window.feedbackData[group] = val;
    });
  });

  let toastTimer;
  function showToast(message, isError) {
    const toast = document.getElementById('toast');
    toast.textContent = message;
    toast.className = isError ? 'show error' : 'show';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { toast.className = ''; }, 3200);
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str ?? '';
    return div.innerHTML;
  }

  function slugifyName(name) {
    return name.trim().toLowerCase().replace(/[.#$\[\]/]/g, '_').replace(/\s+/g, '_');
  }

  /**
   * Points for a rating: a base score scaled from the 1-5 stars, plus small bonuses
   * for genuinely positive answers on the other questions — so the score reflects
   * more than just the star count, without needing a complicated rubric.
   */
  function calculatePoints(feedback) {
    const base = Number(feedback.rating) * 20; // 20-100
    let bonus = 0;
    if (feedback.clarity === 'Clear') bonus += 5;
    if (feedback.difficulty === 'Easy') bonus += 5;
    if (feedback.intent === 'Would use') bonus += 10;
    return base + bonus;
  }

  // Submit Feedback to Firebase
  const AI_SCORING_DELAY_MS = 2200;

  window.submitFeedback = function() {
    const comment = document.getElementById('comment').value;
    const starInput = document.querySelector('input[name="stars"]:checked');
    const rating = starInput ? starInput.value : null;

    if (!window.feedbackData.clarity || !window.feedbackData.difficulty || !window.feedbackData.intent || !rating) {
      showToast('Please complete all feedback options before submitting.', true);
      return;
    }

    const feedbackSnapshot = { ...window.feedbackData, rating, comment };
    document.querySelector('.submit-feedback-btn').disabled = true;
    document.getElementById('ai-overlay').classList.add('show');

    // The score itself is a simple, transparent formula (see calculatePoints) — this
    // pause is a themed loading moment before the reveal, not a real model call.
    setTimeout(() => finalizeSubmission(feedbackSnapshot), AI_SCORING_DELAY_MS);
  };

  function finalizeSubmission(feedbackSnapshot) {
    const designerName = currentDesignerName;
    const points = calculatePoints(feedbackSnapshot);

    const finalFeedback = {
      ...feedbackSnapshot,
      designerName: designerName || 'Unknown',
      points: points,
      timestamp: Date.now()
    };

    // 1. Push feedback to a 'feedback' node
    const feedbackListRef = ref(db, 'feedback');
    push(feedbackListRef, finalFeedback);

    // 2. Credit the designer's running total atomically — a transaction avoids lost
    // updates if two people submit feedback around the same time.
    if (designerName) {
      const designerRef = ref(db, 'designers/' + slugifyName(designerName));
      runTransaction(designerRef, (current) => {
        if (!current) {
          return { name: designerName, totalPoints: points, ratingsCount: 1 };
        }
        current.name = designerName;
        current.totalPoints = (current.totalPoints || 0) + points;
        current.ratingsCount = (current.ratingsCount || 0) + 1;
        return current;
      });
    }

    // 3. Reset the active session back to 'assembling' for the next participant
    set(sessionRef, {
      sessionId: "active_demo",
      journeyType: "Transfer",
      status: "assembling",
      canvas: [],
      designerName: ""
    }).then(() => {
      document.getElementById('ai-overlay').classList.remove('show');
      document.querySelector('.submit-feedback-btn').disabled = false;
      if (designerName) {
        showToast(`🎉 +${points} points awarded to ${designerName}! Resetting for the next participant.`);
      } else {
        // Don't claim points were awarded when they went nowhere.
        showToast(`Feedback saved, but no designer was attached — ${points} points could not be awarded.`, true);
      }
    });
  }
</script>

</body>
</html>
